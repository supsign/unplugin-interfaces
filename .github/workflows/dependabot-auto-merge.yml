name: Dependabot Auto-Merge

# Policy: NUR patch-Updates werden automatisch gemergt. Minor und Major bleiben
# reviewpflichtig.
#
# Grund fuer die Zurueckhaltung bei minor: die Testabdeckung in diesen Repos ist
# duenn (einstellige bis niedrig zweistellige Testzahlen bei mehreren tausend
# Commits). Ein gruener Lauf belegt damit nicht, dass ein minor-Update
# folgenlos ist -- er belegt nur, dass die wenigen abgedeckten Pfade halten.
#
# Voraussetzungen auf Repo-Seite -- stehen nicht im Repo, deshalb hier notiert:
#
#   1. Auto-Merge in den Repo-Settings aktiviert ("Allow auto-merge").
#   2. Ruleset "main: CI erforderlich" auf dem Default-Branch mit dem
#      Aggregat-Job `ci-ok` aus ci.yml als Required-Status-Check. Ohne
#      Required-Check gilt der PR nicht als "blocked", und `gh pr merge --auto`
#      bricht ab -- der Merge passiert dann schlicht nie.
#   3. In diesem Ruleset "Require branches to be up to date before merging"
#      (strict). Der Grund ist subtil: den Merge fuehrt am Ende der
#      GITHUB_TOKEN aus, und Events aus diesem Token starten keine neuen
#      Workflow-Laeufe. Auf main laeuft nach einem Auto-Merge also keine CI
#      mehr. Getestet wurde nur der Merge-Commit des PRs -- und der ist nur
#      dann aussagekraeftig, wenn der PR aktuell zu main war. Dependabot
#      rebased selbststaendig, der Aufwand bleibt also bei ihm.
#   4. Label `needs-manual-review` -- legt der Job unten notfalls selbst an.
on: pull_request

permissions:
  contents: write
  # Labels haengen an der Issues-API. Ohne diese Berechtigung scheitert das
  # Anlegen des Review-Labels, obwohl pull-requests: write gesetzt ist.
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge
    runs-on: ubuntu-latest
    # user.login statt github.actor: bei einem manuellen Re-Run waere
    # github.actor die Person, die neu gestartet hat.
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Der Job checkt bewusst nichts aus. Ohne GH_REPO leitet die gh-CLI das
      # Repository aus `git remote` ab und bricht dann mit "fatal: not a git
      # repository" ab. `gh pr ...` kommt daran vorbei, weil es die URL im
      # Argument hat -- `gh label create` nimmt keine URL und lief genau
      # deshalb ins Leere.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Dependabot-Metadaten holen
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Auto-Merge nur fuer patch aktivieren
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          if ! gh pr merge --auto --squash "$PR_URL"; then
              echo "::warning::Auto-Merge konnte nicht aktiviert werden. Meist fehlt dem Default-Branch ein Required-Status-Check, dann gilt der PR als nicht blockiert."
          fi

      # Bei Gruppen-PRs meldet fetch-metadata das hoechste Update im Bundle --
      # ein Minor oder Major in der Gruppe macht also den ganzen PR reviewpflichtig.
      # continue-on-error, weil das Label Organisation ist und kein
      # Qualitaetssignal: ein Fehler beim Setzen darf den PR nicht rot
      # machen und damit Dependabot blockieren.
      - name: Minor und Major fuer manuelles Review markieren
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-major'
        continue-on-error: true
        run: |
          # --force legt das Label an oder aktualisiert ein bestehendes.
          # Fehlte es, lief der Job zuvor in "'needs-manual-review' not
          # found" und meldete die Pipeline rot -- genau der Zustand, in
          # dem Dependabot dann haengen bleibt.
          gh label create needs-manual-review \
              --color FBCA04 \
              --description "Dependabot-Update mit minor/major-Anteil: braucht manuelles Review" \
              --force

          gh pr edit "$PR_URL" --add-label needs-manual-review
